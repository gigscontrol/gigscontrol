# CI mínimo (auditoria 27/08/2026): move o gate de qualidade de "depois do
# merge" (build da Vercel) para "antes do merge". Typecheck + lint + testes
# em todo PR e push na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test
