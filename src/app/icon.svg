<svg width="168" height="168" viewBox="0 0 168 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gigs Control">
  <defs>
    <linearGradient id="gcGrad" gradientUnits="userSpaceOnUse" x1="24" y1="14" x2="128" y2="94">
      <stop offset="0" stop-color="#4AC4FF"/>
      <stop offset="0.5" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#2847D7"/>
    </linearGradient>
    <linearGradient id="gcFundo" x1="0" y1="0" x2="168" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2030"/>
      <stop offset="1" stop-color="#0B0D12"/>
