       com folga, e o quadrado arredondado serve de ícone na aba. -->
  <rect width="168" height="168" rx="36" fill="url(#gcFundo)"/>
  <g transform="translate(13.2 34.6) scale(0.95)">
    <g transform="translate(14,0) skewX(-8)" stroke="url(#gcGrad)" stroke-width="16" stroke-linecap="round">
      <path d="M72.5 31.4 A32 32 0 1 0 72.5 72.6"/>
      <path d="M80 52 H58"/>
      <path d="M119.6 36.4 A22 22 0 1 0 119.6 67.6"/>
